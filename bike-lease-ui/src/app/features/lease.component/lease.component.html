<div class="lease-list-header">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter leases..." #input>
  </mat-form-field>
</div>

<div class="mat-elevation-z8">
<table mat-table [dataSource]="computedData()">
  <ng-container matColumnDef="leaseId">
    <th mat-header-cell *matHeaderCellDef> Lease ID </th>
    <td mat-cell *matCellDef="let lease"> {{lease.leaseId}} </td>
  </ng-container>

  <ng-container matColumnDef="eventId">
    <th mat-header-cell *matHeaderCellDef> Event ID </th>
    <td mat-cell *matCellDef="let lease"> {{lease.eventId}} </td>
  </ng-container>

  <ng-container matColumnDef="eventType">
    <th mat-header-cell *matHeaderCellDef> Event Type </th>
    <td mat-cell *matCellDef="let lease"> {{lease.eventType}} </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef> Created At </th>
    <td mat-cell *matCellDef="let lease"> {{lease.createdAt}} </td>
  </ng-container>

  <ng-container matColumnDef="leaseTenure">
    <th mat-header-cell *matHeaderCellDef> Lease Tenure </th>
    <td mat-cell *matCellDef="let lease"> {{lease.leaseTenure}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>

<mat-paginator
  [length]="totalRecords"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5,10,20,50]"
  (page)="pageChanged($event)">
</mat-paginator>

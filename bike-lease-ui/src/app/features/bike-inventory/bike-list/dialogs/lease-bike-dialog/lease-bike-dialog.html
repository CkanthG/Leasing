<h2 mat-dialog-title>Lease Bike</h2>
<mat-dialog-content class="mat-typography">
     <form [formGroup]="leaseForm" class="lease-form-container">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" readonly="true">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Lease Tenure</mat-label>
        <input matInput placeholder="Enter lease tenure" type="number" formControlName="leaseTenure">
      </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial (click)="onLease()">Lease</button>
</mat-dialog-actions>

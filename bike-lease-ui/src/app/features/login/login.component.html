<mat-card class="login-card">

  <mat-card-title>
    Bike Lease Login
  </mat-card-title>

  <mat-card-content>
    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()">

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password">
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Login

      </button>
      </form>
  </mat-card-content>

  <div class="auth-links">
    Don't have an account?
    <a routerLink="/register">
      Register
    </a>
  </div>

</mat-card>

<mat-card class="login-card">

  <mat-card-content>
    
    <div class="branding-panel">

    <img
    [src]="'assets/images/lease-a-bike-logo.png'"
    alt="Logo">

    <h1>Bike Leasing Platform</h1>

    <p>
      Manage bikes, leases, notifications
      and users from a unified platform.
    </p>

  </div>

  <div class="form-panel">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()">

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password">
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Login

      </button>
      </form>
  </div>
    
  </mat-card-content>

  <div class="auth-links">
    Don't have an account?
    <a routerLink="/register">
      Register
    </a>
  </div>

</mat-card>

<mat-toolbar color="primary">

  <span class="logo">
    <img
    [src]="'assets/images/lease-a-bike-logo.png'"
    alt="Logo">
  </span>

  <span class="spacer"></span>

  <button
    mat-button
    routerLink="/dashboard"
    routerLinkActive="active-link">
    Dashboard
  </button>

  <button
    mat-button
    routerLink="/users"
    routerLinkActive="active-link">
    Users
  </button>

  <button
    mat-button
    routerLink="/inventory"
    routerLinkActive="active-link">
    Bike Inventory
  </button>

  <button
    mat-button
    (click)="logout()">
    Logout
  </button>

</mat-toolbar>

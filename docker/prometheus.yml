global:
  scrape_interval: 15s

scrape_configs:

  - job_name: auth-service
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - auth-service:7001

  - job_name: bike-catalog
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - bike-catalog:7002

  - job_name: notification
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - notification-service:7003